<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="app-build" content="2026-08-11-cards-public-read-token-edit-v3">
<meta name="cards-data-file" content="cards_data.json">
<title>Cards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    padding:2rem 1rem 4rem;
    background:#f5f7fa;
    color:#0f172a;
    font-family:"Times New Roman","Microsoft YaHei","PingFang SC",serif;
}
button,input,textarea{font:inherit}
[contenteditable="true"]{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.container{
    width:min(100%,1100px);
    margin:auto;
    padding:2rem 1.8rem;
    background:#fff;
    border-radius:32px;
    box-shadow:0 20px 40px -12px rgba(0,0,0,.15);
}
.page-title{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:12px;
    margin-bottom:1.45rem;
    padding-bottom:.8rem;
    border-bottom:2px solid #e8edf4;
    color:#1e293b;
    font-size:2.2rem;
    font-weight:600;
    letter-spacing:-.5px;
}
.cloud-status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:.35rem .9rem;
    border-radius:999px;
    background:#f1f5f9;
    color:#475569;
    font-size:.82rem;
    font-weight:500;
}
.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#94a3b8;
}
.status-dot.online{background:#22c55e}
.status-dot.offline{background:#ef4444}
.status-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:1.7rem;
    padding-bottom:1rem;
    border-bottom:1px solid #e8edf4;
}
.toolbar-group{display:flex;flex-wrap:wrap;gap:9px}
.btn{
    min-height:36px;
    padding:.45rem 1.1rem;
    border:1px solid #cbd5e1;
    border-radius:999px;
    background:#fff;
    color:#334155;
    font-size:.86rem;
    font-weight:650;
    transition:.15s;
}
.btn:hover{background:#f1f5f9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{border-color:#1e293b;background:#1e293b;color:#fff}
.btn-primary:hover{background:#0f172a}
.btn-sync{border-color:#2563eb;background:#2563eb;color:#fff}
.btn-sync:hover{background:#1d4ed8}
.last-sync{color:#94a3b8;font-size:.8rem}

.locked-panel{
    padding:3.5rem 1.4rem;
    border:1px solid #e2e8f0;
    border-radius:24px;
    background:#f8fafc;
    text-align:center;
}
.locked-panel h2{margin-bottom:.65rem;font-size:1.35rem}
.locked-panel p{
    max-width:620px;
    margin:0 auto 1.25rem;
    color:#64748b;
    font-size:.92rem;
    line-height:1.7;
}
.locked-panel .btn{padding:.6rem 1.5rem}

.add-section{
    margin-bottom:2rem;
    padding:1.5rem;
    border:1px solid #e2e8f0;
    border-radius:24px;
    background:#f8fafc;
}
.add-section h2{margin-bottom:1rem;font-size:1.3rem}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{
    color:#475569;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.04em;
}
.title-input{
    display:block;
    width:100%;
    min-height:44px;
    padding:.72rem 1rem;
    border:1px solid #cbd5e1;
    border-radius:15px;
    background:#fff;
    color:#0f172a;
    outline:none;
}
.title-input:focus{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent;
}
.rich-editor-wrap{
    overflow:hidden;
    border:1px solid #cbd5e1;
    border-radius:16px;
    background:#fff;
}
.rich-editor-wrap:focus-within{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent;
}
.rich-toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    padding:.55rem;
    border-bottom:1px solid #e2e8f0;
    background:#f8fafc;
}
.editor-btn{
    min-width:34px;
    min-height:32px;
    padding:.28rem .62rem;
    border:1px solid #cbd5e1;
    border-radius:9px;
    background:#fff;
    color:#334155;
    font-size:.8rem;
    font-weight:650;
}
.editor-btn:hover{background:#eef2f7}
.editor-btn:active{transform:translateY(1px)}
.rich-editor{
    width:100%;
    min-height:8.4rem;
    max-height:420px;
    overflow:auto;
    padding:.9rem 1rem;
    color:#0f172a;
    outline:none;
    line-height:1.75;
    overflow-wrap:anywhere;
}
.rich-editor:empty::before{
    content:attr(data-placeholder);
    color:#94a3b8;
    pointer-events:none;
}
.rich-editor p,.rich-editor div,.cards-content p,.cards-content div{margin:.3em 0}
.rich-editor ul,.rich-editor ol,.cards-content ul,.cards-content ol{padding-left:1.7em;margin:.45em 0}
.rich-editor blockquote,.cards-content blockquote{
    margin:.55em 0;
    padding:.25em .8em;
    border-left:3px solid #cbd5e1;
    color:#475569;
}
.rich-editor hr,.cards-content hr{
    margin:1em 0;
    border:0;
    border-top:1px solid #cbd5e1;
}
.first-line-indent{text-indent:2em}
.add-button{
    width:100%;
    min-height:46px;
    margin-top:1rem;
    border:0;
    border-radius:999px;
    background:#1e293b;
    color:#fff;
    font-weight:700;
}
.add-button:hover{background:#0f172a}

.list-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:.8rem;
}
.list-header h2{font-size:1.4rem}
.count-badge{
    min-width:38px;
    padding:.22rem .8rem;
    border-radius:999px;
    background:#e8edf4;
    text-align:center;
    font-size:.8rem;
    font-weight:650;
}
.cards-list{
    overflow:hidden;
    border:1px solid #e2e8f0;
    border-radius:20px;
    background:#fff;
}
.cards-item{
    padding:1.15rem 1.2rem .95rem;
    background:#fff;
}
.cards-item+.cards-item{border-top:2px solid #dbe3ed}
.cards-item:hover{background:#fafcff}
.cards-title{
    margin-bottom:.55rem;
    color:#0f172a;
    font-size:1.15rem;
    font-weight:750;
    line-height:1.45;
    overflow-wrap:anywhere;
}
.cards-content{
    overflow-wrap:anywhere;
    color:#0f172a;
    font-size:1rem;
    line-height:1.75;
}
.cards-footer{
    display:flex;
    align-items:flex-end;
    justify-content:flex-start;
    gap:12px;
    margin-top:.9rem;
    width:100%;
}
.item-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-left:auto;
    justify-content:flex-end;
}
.action-btn{
    padding:.28rem .72rem;
    border:0;
    border-radius:999px;
    font-size:.82rem;
    font-weight:650;
}
.edit-btn{background:#dbeafe;color:#1e3a8a}
.edit-btn:hover{background:#bfdbfe}
.delete-btn{background:#fee2e2;color:#991b1b}
.delete-btn:hover{background:#fecaca}
.cards-date{
    margin-left:0;
    margin-right:0;
    color:#94a3b8;
    font-size:.8rem;
    white-space:nowrap;
    text-align:left;
    flex:0 0 auto;
}
.empty-state{
    padding:2.8rem 1rem;
    background:#fafcff;
    color:#94a3b8;
    text-align:center;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right))
            max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    background:rgba(15,23,42,.45);
    backdrop-filter:blur(5px);
}
.dialog{
    width:min(100%,620px);
    max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#fff;
    border-radius:26px;
    box-shadow:0 30px 70px rgba(15,23,42,.28);
}
.dialog-scroll{
    min-height:0;
    overflow-y:auto;
    scrollbar-gutter:stable;
    padding:1.7rem 1.7rem 1rem;
}
.dialog h3{margin-bottom:.4rem;font-size:1.3rem}
.dialog-desc{
    margin-bottom:1rem;
    padding-bottom:.8rem;
    border-bottom:1px solid #e2e8f0;
    color:#64748b;
    font-size:.86rem;
    line-height:1.6;
}
.dialog .form-group{margin-bottom:.95rem}
.dialog input{
    width:100%;
    min-height:44px;
    padding:.72rem 1rem;
    border:1px solid #cbd5e1;
    border-radius:15px;
    background:#fff;
    color:#0f172a;
    outline:none;
}
.dialog input:focus{
    outline:2px solid #93b4ff;
    outline-offset:1px;
    border-color:transparent;
}
.dialog-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;
    padding:.95rem 1.7rem max(.95rem,env(safe-area-inset-bottom));
    border-top:1px solid #e8edf4;
    background:#fff;
}

/* 登录配置弹窗：内容独立滚动，底部按钮始终保留在可见区域 */
#configModal{
    overflow:hidden;
}
#configForm{
    height:min(720px,calc(var(--cards-visible-height,100dvh) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
    max-height:calc(var(--cards-visible-height,100dvh) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
}
#configForm .dialog-scroll{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-gutter:stable;
}
#configForm .dialog-scroll::-webkit-scrollbar{
    width:10px;
}
#configForm .dialog-scroll::-webkit-scrollbar-track{
    background:#f1f5f9;
    border-radius:999px;
}
#configForm .dialog-scroll::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border:2px solid #f1f5f9;
    border-radius:999px;
}
#configForm .dialog-actions{
    flex:0 0 auto;
    position:relative;
    z-index:2;
    margin-top:0;
    box-shadow:0 -8px 20px rgba(15,23,42,.06);
}
.remember-row{
    display:flex;
    align-items:flex-start;
    gap:8px;
    color:#334155;
    font-size:.82rem;
    line-height:1.5;
}
.remember-row input{
    width:auto;
    min-height:auto;
    margin-top:.2rem;
    accent-color:#2563eb;
}

.toast{
    position:fixed;
    left:50%;
    bottom:28px;
    z-index:1500;
    max-width:min(90vw,680px);
    padding:.78rem 1.5rem;
    transform:translateX(-50%);
    border-radius:999px;
    background:#2563eb;
    color:#fff;
    font-size:.88rem;
    font-weight:600;
    text-align:center;
    box-shadow:0 12px 34px rgba(15,23,42,.25);
}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
.toast.info{background:#2563eb}

.back-to-top{
    position:fixed;
    right:16px;
    top:68%;
    z-index:900;
    padding:.45rem .72rem;
    transform:translateY(-50%);
    border:1px solid rgba(148,163,184,.45);
    border-radius:999px;
    background:rgba(255,255,255,.82);
    color:#64748b;
    font-size:.76rem;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:.2s;
}
.back-to-top.visible{opacity:.55;visibility:visible;pointer-events:auto}
.back-to-top:hover{opacity:1}

@media(max-width:700px){
    body{padding:.8rem}
    .container{padding:1.25rem;border-radius:22px}
    .page-title{font-size:1.8rem}
    .toolbar{flex-direction:column;align-items:stretch}
    .toolbar-group{justify-content:center}
    .last-sync{text-align:center}
    .add-section{padding:1.2rem}
    .rich-editor{min-height:8rem}
    .editor-btn{padding:.26rem .52rem}
    .cards-footer{align-items:flex-end}
    .dialog{width:100%;border-radius:20px}
    .dialog-scroll{padding:1.2rem 1.2rem .8rem}
    .dialog-actions{padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom))}
    .dialog-actions .btn{flex:1}
    #configModal{
        align-items:stretch;
        padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right))
                max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
    }
    #configForm{
        width:100%;
        height:calc(var(--cards-visible-height,100dvh) - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        max-height:calc(var(--cards-visible-height,100dvh) - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        border-radius:20px;
    }
    #configForm .dialog-scroll{
        padding:1.2rem 1.2rem .8rem;
    }
    #configForm .dialog-actions{
        padding:.85rem 1.2rem max(.85rem,env(safe-area-inset-bottom));
    }
    .back-to-top{right:8px}
}
</style>
</head>
<body>
<main class="container">
    <h1 class="page-title">
        Cards
        <span class="cloud-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">公开浏览</span>
        </span>
    </h1>

    <section class="toolbar">
        <div class="toolbar-group">
            <button class="btn btn-sync" id="syncBtn" type="button" disabled>同步</button>
            <button class="btn" id="configBtn" type="button">编辑登录</button>
            <button class="btn" id="exportBtn" type="button" disabled>导出</button>
            <button class="btn" id="importBtn" type="button" disabled>导入</button>
            <input type="file" id="fileInput" accept=".json,application/json" hidden>
        </div>
        <span class="last-sync" id="lastSyncTime">正在加载公开内容…</span>
    </section>

    <section class="locked-panel" id="lockedPanel">
        <h2>公开浏览模式</h2>
        <p>任何打开本页面的人都可以浏览 Cards。新增、编辑、删除、导入和同步等写操作需要 GitHub Token 登录。</p>
        <button class="btn btn-primary" id="lockedConfigBtn" type="button">编辑登录</button>
    </section>

    <div id="appContent">
        <section class="add-section hidden" id="editorSection">
            <h2>添加</h2>
            <div class="form-group" style="margin-bottom:.9rem">
                <label for="titleInput">标题</label>
                <input class="title-input" id="titleInput" type="text" autocomplete="off" placeholder="可留空">
            </div>
            <div class="form-group">
                <label for="contentInput">内容</label>
                <div class="rich-editor-wrap">
                    <div class="rich-toolbar" id="contentToolbar" role="toolbar" aria-label="正文格式工具">
                        <button class="editor-btn" type="button" data-command="bold" title="加粗"><b>B</b></button>
                        <button class="editor-btn" type="button" data-command="italic" title="斜体"><i>I</i></button>
                        <button class="editor-btn" type="button" data-command="underline" title="下划线"><u>U</u></button>
                        <button class="editor-btn" type="button" data-command="strikeThrough" title="删除线"><s>S</s></button>
                        <button class="editor-btn" type="button" data-action="indent" title="首行缩进">首行缩进</button>
                        <button class="editor-btn" type="button" data-command="insertUnorderedList" title="无序列表">• 列表</button>
                        <button class="editor-btn" type="button" data-command="insertOrderedList" title="有序列表">1. 列表</button>
                        <button class="editor-btn" type="button" data-action="quote" title="引用">引用</button>
                        <button class="editor-btn" type="button" data-action="hr" title="横线分隔线">分隔线</button>
                        <button class="editor-btn" type="button" data-command="undo" title="撤销">撤销</button>
                        <button class="editor-btn" type="button" data-command="redo" title="重做">重做</button>
                        <button class="editor-btn" type="button" data-command="removeFormat" title="清除格式">清除格式</button>
                    </div>
                    <div class="rich-editor" id="contentInput" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="请输入内容；Ctrl / ⌘ + Enter 提交"></div>
                </div>
            </div>
            <button class="add-button" id="addBtn" type="button">提交</button>
        </section>

        <section>
            <div class="list-header">
                <h2>总表</h2>
                <span class="count-badge" id="countDisplay">0</span>
            </div>
            <div class="cards-list" id="cardsList">
                <div class="empty-state">正在加载 Cards…</div>
            </div>
        </section>
    </div>
</main>

<section class="overlay hidden" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editHeading">
    <div class="dialog">
        <div class="dialog-scroll">
            <h3 id="editHeading">编辑 Cards</h3>
            <div class="form-group">
                <label for="editTitle">标题</label>
                <input class="title-input" id="editTitle" type="text" autocomplete="off" placeholder="可留空">
            </div>
            <div class="form-group">
                <label for="editContent">内容</label>
                <div class="rich-editor-wrap">
                    <div class="rich-toolbar" id="editToolbar" role="toolbar" aria-label="编辑正文格式工具">
                        <button class="editor-btn" type="button" data-command="bold" title="加粗"><b>B</b></button>
                        <button class="editor-btn" type="button" data-command="italic" title="斜体"><i>I</i></button>
                        <button class="editor-btn" type="button" data-command="underline" title="下划线"><u>U</u></button>
                        <button class="editor-btn" type="button" data-command="strikeThrough" title="删除线"><s>S</s></button>
                        <button class="editor-btn" type="button" data-action="indent" title="首行缩进">首行缩进</button>
                        <button class="editor-btn" type="button" data-command="insertUnorderedList" title="无序列表">• 列表</button>
                        <button class="editor-btn" type="button" data-command="insertOrderedList" title="有序列表">1. 列表</button>
                        <button class="editor-btn" type="button" data-action="quote" title="引用">引用</button>
                        <button class="editor-btn" type="button" data-action="hr" title="横线分隔线">分隔线</button>
                        <button class="editor-btn" type="button" data-command="undo" title="撤销">撤销</button>
                        <button class="editor-btn" type="button" data-command="redo" title="重做">重做</button>
                        <button class="editor-btn" type="button" data-command="removeFormat" title="清除格式">清除格式</button>
                    </div>
                    <div class="rich-editor" id="editContent" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="请输入内容；Ctrl / ⌘ + Enter 保存"></div>
                </div>
            </div>
        </div>
        <div class="dialog-actions">
            <button class="btn" id="editCancel" type="button">取消</button>
            <button class="btn btn-primary" id="editSave" type="button">保存</button>
        </div>
    </div>
</section>

<section class="overlay hidden" id="configModal" role="dialog" aria-modal="true" aria-labelledby="configHeading">
    <form class="dialog" id="configForm" autocomplete="on">
        <div class="dialog-scroll">
            <h3 id="configHeading">GitHub 登录配置</h3>
            <p class="dialog-desc">
                浏览 Cards 不需要 Token。这里的 Token 仅用于新增、编辑、删除、导入和同步；建议使用仅授权目标仓库、并具有 Contents 读取和写入权限的细粒度 Token。
            </p>
            <div class="form-group">
                <label for="cfgOwner">仓库所有者</label>
                <input id="cfgOwner" name="github-owner" type="text" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="cfgRepo">仓库名称</label>
                <input id="cfgRepo" type="text" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="cfgFile">数据文件路径</label>
                <input id="cfgFile" type="text" value="cards_data.json" autocomplete="off">
            </div>
            <div class="form-group">
                <label for="cfgToken">GitHub Personal Access Token</label>
                <input id="cfgToken" name="github-token" type="password" autocomplete="current-password" spellcheck="false">
            </div>
            <label class="remember-row">
                <input type="checkbox" id="rememberToken" checked>
                <span>在本设备保存 Token。取消勾选时，Token 仅保存到当前浏览器会话。</span>
            </label>
        </div>
        <div class="dialog-actions">
            <button class="btn" id="configCancel" type="button">取消</button>
            <button class="btn btn-primary" id="configSave" type="submit">保存并登录</button>
        </div>
    </form>
</section>

<button class="back-to-top" id="backToTopBtn" type="button">↑ 回到顶部</button>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';

// ---------- 页面实例与存储 ----------
function pageIdentity(){
    let p=(location.pathname||'/').replace(/\\/g,'/').replace(/\/+/g,'/').replace(/\/(?:index\.html?)$/i,'/');
    if(p.length>1&&p.endsWith('/'))p=p.slice(0,-1);
    return `${location.origin}${p}`;
}
function hashIdentity(value){
    let hash=0x811c9dc5;
    for(let i=0;i<value.length;i++){
        hash^=value.charCodeAt(i);
        hash=Math.imul(hash,0x01000193);
    }
    return (hash>>>0).toString(16).padStart(8,'0');
}

// ---------- 通用工具 ----------
function clean(v){return String(v??'').normalize('NFKC').trim()}
function esc(v){const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML}
function attr(v){return esc(v).replace(/"/g,'&quot;')}
function uid(){
    return crypto?.randomUUID
        ? crypto.randomUUID()
        : `cards_${Date.now()}_${Math.random().toString(36).slice(2,10)}`;
}
function validIso(v){
    const s=clean(v);
    return s&&!Number.isNaN(Date.parse(s))?new Date(s).toISOString():'';
}
const ALLOWED_TAGS=new Set(['B','STRONG','I','EM','U','S','STRIKE','P','DIV','BR','HR','UL','OL','LI','BLOCKQUOTE']);
function sanitizeHtml(value){
    const template=document.createElement('template');
    template.innerHTML=String(value??'');

    const cleanNode=node=>{
        for(const child of [...node.childNodes]){
            if(child.nodeType===Node.COMMENT_NODE){
                child.remove();
                continue;
            }
            if(child.nodeType!==Node.ELEMENT_NODE)continue;

            const tag=child.tagName.toUpperCase();
            if(tag==='SCRIPT'||tag==='STYLE'||tag==='IFRAME'||tag==='OBJECT'||tag==='EMBED'||tag==='LINK'||tag==='META'){
                child.remove();
                continue;
            }
            cleanNode(child);
            if(!ALLOWED_TAGS.has(tag)){
                child.replaceWith(...child.childNodes);
                continue;
            }

            const keepIndent=(tag==='P'||tag==='DIV')&&child.classList.contains('first-line-indent');
            for(const attribute of [...child.attributes])child.removeAttribute(attribute.name);
            if(keepIndent)child.className='first-line-indent';
        }
    };

    cleanNode(template.content);
    return template.innerHTML.trim();
}
function plainTextToHtml(value){
    const text=String(value??'').replace(/\r\n?/g,'\n').trim();
    return text?esc(text).replace(/\n/g,'<br>'):'';
}
function htmlToText(value){
    const div=document.createElement('div');
    div.innerHTML=sanitizeHtml(value);
    return (div.textContent||'').replace(/\u00a0/g,' ').trim();
}
function hasMeaningfulContent(value){
    return Boolean(htmlToText(value));
}
function getEditorHtml(editor){
    return sanitizeHtml(editor.innerHTML);
}
function setEditorHtml(editor,value){
    editor.innerHTML=sanitizeHtml(value);
}
function normalizeEntry(x){
    if(!x||typeof x!=='object')return null;
    const title=String(x.title??'').trim();
    const raw=String(x.content??'').trim();
    const content=x.contentFormat==='html'?sanitizeHtml(raw):plainTextToHtml(raw);
    const createdAt=validIso(x.createdAt);
    if(!hasMeaningfulContent(content)||!createdAt)return null;
    return{
        id:clean(x.id)||uid(),
        title,
        content,
        contentFormat:'html',
        createdAt
    };
}
function normalizeState(value){
    const source=Array.isArray(value)?value:(value&&Array.isArray(value.entries)?value.entries:[]);
    return source
        .map(normalizeEntry)
        .filter(Boolean)
        .sort((a,b)=>{
            const byTime=Date.parse(b.createdAt)-Date.parse(a.createdAt);
            if(byTime!==0)return byTime;
            return String(b.id).localeCompare(String(a.id));
        });
}
function fingerprint(value=state){
    return JSON.stringify(normalizeState(value));
}
function formatDate(iso){
    const d=new Date(iso);
    if(Number.isNaN(d.getTime()))return '';
    const y=d.getFullYear();
    const m=String(d.getMonth()+1).padStart(2,'0');
    const day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
}
function target(){
    return config.owner&&config.repo&&config.file
        ? `${config.owner}/${config.repo}/${config.file}`
        : '';
}
function adminConfigured(){
    return Boolean(config.owner&&config.repo&&config.file&&config.token);
}
function pathEncode(path){
    return String(path).split('/').filter(Boolean).map(encodeURIComponent).join('/');
}
function localSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function localGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sessionSet(k,v){try{sessionStorage.setItem(k,v);return true}catch(e){return false}}
function sessionGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function removeStored(k,kind='local'){
    try{(kind==='local'?localStorage:sessionStorage).removeItem(k)}catch(e){}
}
function show(msg,type='info'){
    toast.textContent=msg;
    toast.className=`toast ${type}`;
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.add('hidden'),3200);
}
function status(kind,text){

}
function formatError(error){
    if(!error)return '未知错误';
    if(error.status===401)return 'Token 无效或已过期';
    if(error.status===403)return 'Token 权限不足或仓库访问被拒绝';
    if(error.status===404)return '仓库或数据文件不存在，或 Token 无权访问';
    if(error.status===409)return '云端文件已被其他设备修改';
    return error.message||String(error);
}

    config.repo=clean(saved.repo);

    config.token=clean(localGet(TOKEN_LOCAL_KEY)||sessionGet(TOKEN_SESSION_KEY)||'');

        removeStored(TOKEN_SESSION_KEY,'session');

        sessionSet(TOKEN_SESSION_KEY,config.token);
        removeStored(TOKEN_LOCAL_KEY,'local');
    }
}
function loadMeta(){

        const x=JSON.parse(localGet(META_KEY)||'{}')||{};
        meta={
            target:clean(x.target),

            lastSyncAt:clean(x.lastSyncAt)||null
        };
    }catch(e){
        meta={target:'',fingerprint:null,sha:null,lastSyncAt:null};
    }
}
function saveMeta(){localSet(META_KEY,JSON.stringify(meta))}
function saveCache(){localSet(CACHE_KEY,JSON.stringify(normalizeState(state)))}

// ---------- GitHub API ----------
async function githubApi(method,endpoint='',body=null){
    const owner=encodeURIComponent(config.owner);
    const repo=encodeURIComponent(config.repo);
    const suffix=endpoint?`/${endpoint}`:'';
    const url=`https://api.github.com/repos/${owner}/${repo}${suffix}`;
    const headers={
        'Authorization':`Bearer ${config.token}`,
        'Accept':'application/vnd.github+json',
        'X-GitHub-Api-Version':API_VERSION
    };
    const options={method,headers};
    if(body!==null){
        headers['Content-Type']='application/json';
        options.body=JSON.stringify(body);
    }
    const response=await fetch(url,options);
    const raw=await response.text();
    let data=null;
    if(raw){
        try{data=JSON.parse(raw)}catch(e){data={message:raw}}
    }
    if(!response.ok){
        const error=new Error(data?.message||`HTTP ${response.status}`);
        error.status=response.status;
        error.payload=data;
        throw error;
    }
    return data;
}
function utf8ToBase64(text){
    const bytes=new TextEncoder().encode(text);
    let binary='';
    for(let i=0;i<bytes.length;i+=0x8000){
        binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    }
    return btoa(binary);
}
function base64ToUtf8(base64){
    const binary=atob(String(base64||'').replace(/\s/g,''));
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
}
async function verifyRepository(){
    // 先验证 Token 对目标仓库确实有访问权，避免仅凭本地存在 Token 就解锁内容。
    return githubApi('GET');
}
async function readRemote(){
    try{
        const data=await githubApi('GET',`contents/${pathEncode(config.file)}`);
        if(!data||data.type!=='file'||typeof data.content!=='string'||!data.sha){
            throw new Error('云端数据文件格式异常');
        }
        if(Number.isFinite(data.size)&&data.size>MAX_BYTES){
            throw new Error('云端数据超过 750 KB');
        }
        const parsed=JSON.parse(base64ToUtf8(data.content));
        return{
            exists:true,
            sha:data.sha,
            state:normalizeState(parsed)
        };
    }catch(error){
        if(error.status===404){
            return{exists:false,sha:null,state:[]};
        }
        throw error;
    }
}
async function writeRemote(snapshot,sha){
    const normalized=normalizeState(snapshot);
    const raw=JSON.stringify({schemaVersion:2,entries:normalized},null,2);
    if(new TextEncoder().encode(raw).length>MAX_BYTES){
        throw new Error('数据超过 750 KB');
    }
    const body={
        message:`更新 Cards 数据 - ${new Date().toLocaleString()}`,
        content:utf8ToBase64(raw)
    };
    if(sha)body.sha=sha;
    const result=await githubApi('PUT',`contents/${pathEncode(config.file)}`,body);
    return result?.content?.sha||null;
}

// ---------- 渲染 ----------
function render(){
    state=normalizeState(state);
    countDisplay.textContent=String(state.length);

    if(!state.length){
        cardsList.innerHTML='<div class="empty-state">暂无 Cards</div>';
        saveCache();
        return;
    }

    cardsList.innerHTML=state.map(item=>`
        <article class="cards-item">
            ${item.title?`<h3 class="cards-title">${esc(item.title)}</h3>`:''}
            <div class="cards-content">${sanitizeHtml(item.content)}</div>
            <div class="cards-footer">
                <time class="cards-date" datetime="${attr(item.createdAt)}">${formatDate(item.createdAt)}</time>
                ${unlocked?`
                <div class="item-actions">
                    <button class="action-btn edit-btn" data-id="${attr(item.id)}" type="button">编辑</button>
                    <button class="action-btn delete-btn" data-id="${attr(item.id)}" type="button">删除</button>
                </div>`:''}
            </div>
        </article>
    `).join('');

    publicLoaded=true;
    exportBtn.disabled=false;
    saveCache();
}

// ---------- 编辑登录 / 解锁写权限 ----------
async function login(showResult=true){
    if(!adminConfigured()){
        setUnlocked(false);
        if(publicLoaded||state.length)render();
        status(publicLoaded?'online':'offline',publicLoaded?'公开浏览':'公开数据不可用');
        lastSyncTime.textContent=publicLoaded?'公开浏览 · 编辑需 Token':'公开数据未加载 · 编辑需 Token';
        if(showResult)show('请填写仓库和 Token 以启用编辑','error');
        return false;
    }

    status('syncing','验证编辑权限…');
    syncBtn.disabled=true;
    exportBtn.disabled=true;
    importBtn.disabled=true;

    try{
        await verifyRepository();
        const remote=await readRemote();
        const remoteFp=fingerprint(remote.state);

        // 只有同一同步目标存在未同步本地修改时，才允许在验证成功后恢复缓存。
        const cache=loadCache();
        const sameTarget=meta.target===target();
        const cacheFp=fingerprint(cache);
        const cacheUnsynced=sameTarget&&meta.fingerprint!==null&&cacheFp!==meta.fingerprint&&cacheFp!==remoteFp;

        if(cacheUnsynced){
            state=cache;
            setUnlocked(true);
            render();

            if(remote.exists&&remoteFp!==meta.fingerprint){
                status('offline','存在同步冲突');
                lastSyncTime.textContent='编辑已登录 · 本地和云端均有修改';
                if(showResult)show('编辑登录成功，但检测到本地与云端均有修改，请点击“同步”处理','error');
            }else{
                status('offline','有未同步修改');
                lastSyncTime.textContent='编辑已登录 · 正在恢复未同步修改';
                scheduleSync();
                if(showResult)show('编辑登录成功，已恢复本地未同步修改','success');
            }
        }else{
            state=remote.state;
            setUnlocked(true);
            render();
            record(state,remote.sha);
            status('online','编辑已登录');
            if(!remote.exists)lastSyncTime.textContent='编辑已登录 · 数据文件尚未创建';
            if(showResult)show('Token 验证成功，已启用编辑','success');
        }

        return true;
    }catch(error){
        console.error(error);
        setUnlocked(false);
        if(publicLoaded||state.length)render();
        status(publicLoaded?'online':'offline',publicLoaded?'公开浏览':'公开数据不可用');
        lastSyncTime.textContent=publicLoaded?'公开浏览 · Token 验证失败':'公开数据未加载 · Token 验证失败';
        if(showResult)show(`编辑登录失败：${formatError(error)}`,'error');
        return false;
    }
}

// ---------- 同步 ----------
async function sync(showResult=true,interactive=showResult){
    if(!unlocked||!adminConfigured()){
        show('请先使用 Token 登录','error');
        return false;
    }
    if(syncing)return false;

    clearTimeout(autoTimer);
    autoTimer=null;
    syncing=true;
    syncBtn.disabled=true;
    status('syncing','同步中…');

    try{
        const localSnapshot=normalizeState(state);
        const localFp=fingerprint(localSnapshot);
        const baseline=meta.target===target()?meta.fingerprint:null;
        const remote=await readRemote();

        if(!remote.exists){
            if(baseline!==null&&interactive){
                const recreate=confirm('云端数据文件已不存在。\n\n确定：用当前 Cards 数据重新创建云端文件。\n取消：停止同步。');
                if(!recreate){
                    status('offline','同步已取消');
                    return false;
                }
            }else if(baseline!==null&&!interactive){
                status('offline','云端文件已删除');
                show('云端文件已删除，请点击“同步”决定是否重新创建','error');
                return false;
            }

            const sha=await writeRemote(localSnapshot,null);
            record(localSnapshot,sha);
            status('online','编辑已登录');
            if(showResult)show('同步完成','success');
            return true;
        }

        const remoteFp=fingerprint(remote.state);

        if(localFp===remoteFp){
            record(localSnapshot,remote.sha);
            status('online','编辑已登录');
            if(showResult)show('本地与云端已一致','success');
            return true;
        }

        const localChanged=baseline===null||localFp!==baseline;
        const remoteChanged=baseline===null||remoteFp!==baseline;

        if(baseline!==null&&localChanged&&!remoteChanged){
            const sha=await writeRemote(localSnapshot,remote.sha);
            record(localSnapshot,sha);
            status('online','编辑已登录');
            if(showResult)show('同步完成','success');
            return true;
        }

        if(baseline!==null&&!localChanged&&remoteChanged){
            state=remote.state;
            render();
            record(state,remote.sha);
            status('online','编辑已登录');
            if(showResult)show('已采用云端最新数据','success');
            return true;
        }

        if(!interactive){
            status('offline','存在同步冲突');
            show('本地和云端都发生了修改，请点击“同步”选择版本','error');
            return false;
        }

        const useLocal=confirm(
            '检测到本地和云端数据不同。\n\n' +
            '确定：用当前网页数据覆盖云端。\n' +
            '取消：继续选择是否采用云端数据。'
        );

        if(useLocal){
            const sha=await writeRemote(localSnapshot,remote.sha);
            record(localSnapshot,sha);
            status('online','编辑已登录');
            show('已用当前网页数据覆盖云端','success');
            return true;
        }

        const useRemote=confirm(
            '是否采用云端数据覆盖当前网页？\n\n' +
            '确定：采用云端最新数据。\n' +
            '取消：暂不处理。'
        );

        if(useRemote){
            state=remote.state;
            render();
            record(state,remote.sha);
            status('online','编辑已登录');
            show('已采用云端数据','success');
            return true;
        }

        status('offline','同步已取消');
        show('未覆盖本地或云端数据','info');
        return false;
    }catch(error){
        console.error(error);
        status('offline','同步失败');
        show(`同步失败：${formatError(error)}`,'error');
        return false;
    }finally{
        syncing=false;
        syncBtn.disabled=!unlocked;
    }
}
function scheduleSync(){
    saveCache();
    if(!unlocked)return;
    clearTimeout(autoTimer);
    autoTimer=setTimeout(()=>{
        autoTimer=null;
        sync(false,false);
    },AUTO_DELAY);
}
function markLocalChange(){
    render();
    status('offline','待同步');
    lastSyncTime.textContent='有未同步修改';
    scheduleSync();
}

// ---------- 富文本编辑 ----------
function selectionInside(editor){
    const sel=window.getSelection();
    return sel&&sel.rangeCount>0&&editor.contains(sel.anchorNode);
}
function currentBlock(editor){
    const sel=window.getSelection();
    let node=sel?.anchorNode||null;
    if(node&&node.nodeType===Node.TEXT_NODE)node=node.parentElement;
    while(node&&node!==editor){
        if(node.nodeType===Node.ELEMENT_NODE&&['P','DIV','LI','BLOCKQUOTE'].includes(node.tagName))return node;
        node=node.parentElement;
    }
    return null;
}
function ensureEditorSelection(editor){
    editor.focus();
    if(selectionInside(editor))return;
    const range=document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
}
function toggleFirstLineIndent(editor){
    ensureEditorSelection(editor);
    let block=currentBlock(editor);
    if(!block||block.tagName==='LI'||block.tagName==='BLOCKQUOTE'){
        document.execCommand('formatBlock',false,'p');
        block=currentBlock(editor);
    }
    if(block)block.classList.toggle('first-line-indent');
}
function toggleQuote(editor){
    ensureEditorSelection(editor);
    const block=currentBlock(editor);
    document.execCommand('formatBlock',false,block?.tagName==='BLOCKQUOTE'?'p':'blockquote');
}
function runEditorAction(editor,button){
    ensureEditorSelection(editor);
    const command=button.dataset.command;
    const action=button.dataset.action;
    if(command){
        document.execCommand(command,false,null);
    }else if(action==='indent'){
        toggleFirstLineIndent(editor);
    }else if(action==='quote'){
        toggleQuote(editor);
    }else if(action==='hr'){
        document.execCommand('insertHorizontalRule',false,null);
    }
    editor.focus();
}
function setupRichEditor(editor,toolbar){
    toolbar.addEventListener('mousedown',event=>{
        const button=event.target.closest('.editor-btn');
        if(button)event.preventDefault();
    });
    toolbar.addEventListener('click',event=>{
        const button=event.target.closest('.editor-btn');
        if(!button)return;
        runEditorAction(editor,button);
    });
    editor.addEventListener('paste',event=>{
        // 只接收纯文本粘贴，避免把外部网页样式、脚本或跟踪属性带入数据。
        event.preventDefault();
        const text=event.clipboardData?.getData('text/plain')||'';
        document.execCommand('insertText',false,text);
    });
}
setupRichEditor(contentInput,contentToolbar);
setupRichEditor(editContent,editToolbar);

// ---------- Cards 增删改 ----------
function addEntry(){
    if(!unlocked)return;
    const title=String(titleInput.value??'').trim();
    const content=getEditorHtml(contentInput);
    if(!hasMeaningfulContent(content)){
        show('请输入内容','error');
        contentInput.focus();
        return;
    }

    state.push({
        id:uid(),
        title,
        content,
        contentFormat:'html',
        createdAt:new Date().toISOString()
    });

    titleInput.value='';
    contentInput.innerHTML='';
    markLocalChange();
    titleInput.focus();
    show('已提交','success');
}
function openEdit(id){
    if(!unlocked)return;
    const item=state.find(x=>x.id===id);
    if(!item)return;
    editingId=id;
    editTitle.value=item.title||'';
    setEditorHtml(editContent,item.content);
    editModal.classList.remove('hidden');
    setTimeout(()=>editTitle.focus(),30);
}
function saveEdit(){
    if(!unlocked)return;
    const item=state.find(x=>x.id===editingId);
    if(!item)return;

    const title=String(editTitle.value??'').trim();
    const content=getEditorHtml(editContent);
    if(!hasMeaningfulContent(content)){
        show('内容不能为空','error');
        editContent.focus();
        return;
    }

    // 编辑标题和内容，但保留原始提交时间，因此总表排序位置不会因编辑而改变。
    item.title=title;
    item.content=content;
    item.contentFormat='html';
    editingId='';
    editModal.classList.add('hidden');
    markLocalChange();
    show('已保存','success');
}
function deleteEntry(id){
    if(!unlocked)return;
    const item=state.find(x=>x.id===id);
    if(!item)return;
    if(!confirm('确定删除这条 Cards 吗？'))return;
    state=state.filter(x=>x.id!==id);
    markLocalChange();
    show('已删除','success');
}

// ---------- 导入导出 ----------
function downloadJson(){
    if(!unlocked)return;
    const payload={schemaVersion:2,entries:normalizeState(state)};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`cards_backup_${formatDate(new Date().toISOString())}.json`;
    a.click();
    URL.revokeObjectURL(url);
}
function importFile(file){
    if(!unlocked||!file)return;
    if(file.size>MAX_BYTES){
        show('文件超过 750 KB','error');
        return;
    }
    const reader=new FileReader();
    reader.onload=e=>{
        try{
            const incoming=normalizeState(JSON.parse(e.target.result));
            if(!confirm('导入会替换当前 Cards 数据，确定继续吗？'))return;
            state=incoming;
            markLocalChange();
            show('导入成功','success');
        }catch(error){
            show(`导入失败：${error.message}`,'error');
        }
    };
    reader.readAsText(file,'utf-8');
}

// ---------- 配置 ----------
function openConfig(){
    cfgOwner.value=config.owner;
    cfgRepo.value=config.repo;
    cfgFile.value=config.file||'cards_data.json';
    cfgToken.value=config.token;
    rememberToken.checked=Boolean(localGet(TOKEN_LOCAL_KEY));
    updateVisibleViewportHeight();
    configModal.classList.remove('hidden');
    const scrollBody=configForm.querySelector('.dialog-scroll');
    if(scrollBody)scrollBody.scrollTop=0;
}
async function submitConfig(event){
    event.preventDefault();
    const owner=clean(cfgOwner.value);
    const repo=clean(cfgRepo.value);
    const file=clean(cfgFile.value)||'cards_data.json';
    const token=clean(cfgToken.value);

    if(!owner||!repo||!token){
        show('请完整填写仓库和 Token','error');
        return;
    }

    const oldTarget=target();
    config={owner,repo,file,token};
    saveConfig();

    if(oldTarget&&oldTarget!==target()){
        meta={target:'',fingerprint:null,sha:null,lastSyncAt:null};
        saveMeta();
    }

    configModal.classList.add('hidden');
    await login(true);
}

// ---------- 事件 ----------
addBtn.addEventListener('click',addEntry);
titleInput.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){
        event.preventDefault();
        addEntry();
    }
});
contentInput.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){
        event.preventDefault();
        addEntry();
    }
});

cardsList.addEventListener('click',event=>{
    const edit=event.target.closest('.edit-btn');
    if(edit)return openEdit(edit.dataset.id);
    const del=event.target.closest('.delete-btn');
    if(del)deleteEntry(del.dataset.id);
});

editCancel.addEventListener('click',()=>{
    editingId='';
    editModal.classList.add('hidden');
});
editSave.addEventListener('click',saveEdit);
editTitle.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){
        event.preventDefault();
        saveEdit();
    }
});
editContent.addEventListener('keydown',event=>{
    if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){
        event.preventDefault();
        saveEdit();
    }
});

configBtn.addEventListener('click',openConfig);
lockedConfigBtn.addEventListener('click',openConfig);
configCancel.addEventListener('click',()=>configModal.classList.add('hidden'));
configForm.addEventListener('submit',submitConfig);

syncBtn.addEventListener('click',()=>sync(true,true));
exportBtn.addEventListener('click',downloadJson);
importBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{
    importFile(fileInput.files?.[0]);
    fileInput.value='';
});

document.addEventListener('keydown',event=>{
    if(event.key!=='Escape')return;
    editingId='';
    editModal.classList.add('hidden');
    configModal.classList.add('hidden');
});

backToTopBtn.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
addEventListener('scroll',()=>{
    backToTopBtn.classList.toggle('visible',scrollY>260);
},{passive:true});

// ---------- 启动 ----------
(async()=>{
    loadConfig();
    loadMeta();
    setUnlocked(false);

    await loadPublicView();

    // 本设备若已保存编辑Token，则静默尝试恢复写权限；
    // 即使Token失效，公开浏览也不会被锁住或清空。
    if(adminConfigured()){
        await login(false);
    }
})();
})();
</script>
